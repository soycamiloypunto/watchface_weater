<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Land — Simulador AMOLED Wear OS (450×450)</title>
<style>
  @font-face { font-family: 'FontPixel';   src: url('app/src/main/res/font/font_pixel.ttf') format('truetype'); }
  @font-face { font-family: 'FontNothing'; src: url('app/src/main/res/font/font_nothing.ttf') format('truetype'); }
  @font-face { font-family: 'FontSport';   src: url('app/src/main/res/font/font_sport.ttf') format('truetype'); }
  @font-face { font-family: 'FontClassic'; src: url('app/src/main/res/font/font_classic.ttf') format('truetype'); }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    margin: 0; min-height: 100vh; background: #0c0e14; color: #eef2ff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; color: #c7d2fe; }
  .watch-bezel {
    width: 486px; height: 486px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #3a3f4b, #14171f 70%, #090a0e);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.85), inset 0 2px 6px rgba(255,255,255,0.18);
    border: 3px solid #2a2f3a;
  }
  canvas {
    width: 450px; height: 450px; border-radius: 50%; background: #000;
    box-shadow: inset 0 0 24px rgba(255,255,255,0.06);
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 7px; max-width: 920px; justify-content: center;
  }
  button {
    background: #1b2030; color: #e2e8f0; border: 1px solid #334155;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 0.83rem; transition: 0.15s;
  }
  button:hover { background: #27314a; }
  button.active { background: #3b82f6; border-color: #60a5fa; color: #fff; font-weight: 600; }
  .toggles {
    display: flex; flex-wrap: wrap; gap: 12px 16px; max-width: 920px; justify-content: center;
    align-items: center; font-size: 0.86rem; color: #cbd5e1;
    background: #131826; border: 1px solid #263149; padding: 12px 18px; border-radius: 14px;
  }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles select {
    background: #1e2638; color: #fff; border: 1px solid #3b4b6b;
    border-radius: 8px; padding: 4px 8px; font-size: 0.84rem;
  }
</style>
</head>
<body>
  <h1>Weather Land — Vista previa AMOLED v5 (AOD + Bisel Batería + Pasos/Calorías + Hora/Fecha Avanzada)</h1>
  <div class="watch-bezel">
    <canvas id="watch" width="450" height="450"></canvas>
  </div>
  <div class="controls" id="modes"></div>
  <div class="toggles">
    <label>Hora:
      <select id="sTime">
        <option value="h24" selected>24h (14:00)</option>
        <option value="h12_short">12h (02:00)</option>
        <option value="h12_ampm">12h AM/PM</option>
        <option value="text_es">Texto (Mediodía / y cuarto)</option>
        <option value="hidden">Oculta</option>
      </select>
    </label>
    <label>Fuente:
      <select id="sFont">
        <option value="FontPixel" selected>Pixel (Moderna)</option>
        <option value="FontNothing">Nothing (Puntos)</option>
        <option value="FontSport">Deportiva (Condensada)</option>
        <option value="FontClassic">Clásica (Serif)</option>
      </select>
    </label>
    <label>Tamaño Hora:
      <select id="sSize">
        <option value="normal" selected>Normal (1x)</option>
        <option value="large">Grande (1.35x)</option>
        <option value="xl">Gigante (1.75x)</option>
      </select>
    </label>
    <label>Fecha:
      <select id="sDate">
        <option value="short">12/12/2026</option>
        <option value="medium" selected>12-DIC-26</option>
        <option value="long">12 Diciembre 2026</option>
        <option value="hidden">Oculta</option>
      </select>
    </label>
    <label><input type="checkbox" id="tBatt" checked /> Barra Batería (3h–9h)</label>
    <label><input type="range" id="rBatt" min="5" max="100" value="82" style="width:74px" /> <span id="battVal">82%</span></label>
    <label><input type="checkbox" id="tCal" checked /> Calorías (9h–12h)</label>
    <label><input type="checkbox" id="tSteps" checked /> Pasos (12h–3h)</label>
    <label><input type="checkbox" id="tTemp" checked /> Temperatura</label>
    <label><input type="checkbox" id="tFog" checked /> Vidrio empañado</label>
    <label><input type="checkbox" id="tAod" /> 🌙 Modo AOD (Ambient)</label>
  </div>

<script>
const BASE = 'app/src/main/res/drawable/';
const CACHE_VER = 'v5';
const FILES = [
  'sol',
  'moon_new', 'moon_waxing_crescent', 'moon_first_quarter', 'moon_waxing_gibbous',
  'moon_full', 'moon_waning_gibbous', 'moon_last_quarter', 'moon_waning_crescent',
  'cloud_white_1', 'cloud_white_2_sep', 'cloud_white_2_stack', 'cloud_white_3',
  'cloud_dark_1', 'cloud_dark_2_sep', 'cloud_dark_2_stack',
  'lightning_left', 'lightning_center', 'lightning_double',
  'fx_sun_corona', 'fx_sun_shimmer_a', 'fx_sun_shimmer_b', 'fx_storm_flash',
  'fx_rain_fast', 'fx_rain_slow', 'fx_glass_fog', 'fx_glass_drops_slide', 'fx_rainbow_prism',
  'fx_snow_slow', 'fx_snow_fast', 'fx_wind_streaks',
  'fx_fog_descend', 'fx_fog_low_fast', 'fx_fog_low_fast_b',
  'celestial_stars_a', 'celestial_stars_b'
];
const IMG = {};
for (const name of FILES) {
  const i = new Image();
  i.src = BASE + name + '.png?' + CACHE_VER;
  IMG[name] = i;
}

const MODES = [
  { id: 'sunny',                label: '☀️ Soleado',                temp: 28 },
  { id: 'partly_day',           label: '⛅ Seminublado Día',         temp: 24 },
  { id: 'partly_night',         label: '☁️🌙 Seminublado Noche',     temp: 13 },
  { id: 'cloudy_day',           label: '☁️ Muy Nublado Día',        temp: 19 },
  { id: 'cloudy_night',         label: '☁️🌙 Muy Nublado Noche',     temp: 12 },
  { id: 'drizzle_day',          label: '🌦️🌈 Llovizna Día (Prisma)', temp: 20 },
  { id: 'drizzle_night',        label: '🌧️🌙 Llovizna Noche',       temp: 14 },
  { id: 'rain_day',             label: '🌧️ Lluvia Día',             temp: 17 },
  { id: 'rain_night',           label: '🌧️🌙 Lluvia Noche',         temp: 13 },
  { id: 'storm',                label: '⛈️ Tormenta + Rayos',        temp: 15 },
  { id: 'snow_day',             label: '❄️ Nieve Día',              temp: 0  },
  { id: 'snow_night',           label: '❄️🌙 Nieve Noche',          temp: -3 },
  { id: 'sleet_day',            label: '🌨️ Aguanieve',              temp: 1  },
  { id: 'fog_day',              label: '🌫️ Niebla Día',             temp: 13 },
  { id: 'fog_night',            label: '🌫️🌙 Niebla Noche',         temp: 10 },
  { id: 'wind_day',             label: '💨 Ventoso Día',            temp: 21 },
  { id: 'moon_new',             label: '🌑 1. Luna Nueva',          temp: 12 },
  { id: 'moon_waxing_crescent', label: '🌒 2. Creciente',           temp: 13 },
  { id: 'moon_first_quarter',   label: '🌓 3. Cuarto Creciente',    temp: 13 },
  { id: 'moon_waxing_gibbous',  label: '🌔 4. Gibosa Creciente',    temp: 14 },
  { id: 'moon_full',            label: '🌕 5. Luna Llena',          temp: 14 },
  { id: 'moon_waning_gibbous',  label: '🌖 6. Gibosa Menguante',    temp: 13 },
  { id: 'moon_last_quarter',    label: '🌗 7. Cuarto Menguante',    temp: 12 },
  { id: 'moon_waning_crescent', label: '🌘 8. Luna Menguante',      temp: 12 }
];

let mode = 'drizzle_day';
const modesEl = document.getElementById('modes');
MODES.forEach(m => {
  const b = document.createElement('button');
  b.textContent = m.label;
  if (m.id === mode) b.classList.add('active');
  b.onclick = () => {
    mode = m.id;
    document.querySelectorAll('#modes button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  };
  modesEl.appendChild(b);
});

const canvas = document.getElementById('watch');
const ctx = canvas.getContext('2d');
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function drawImg(name, x, y, w, h, alpha = 1, angleDeg = 0, scale = 1) {
  const img = IMG[name];
  if (!img || !img.complete || img.naturalWidth === 0 || alpha <= 0.005) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  if (angleDeg !== 0 || scale !== 1) {
    ctx.translate(x + w / 2, y + h / 2);
    if (angleDeg) ctx.rotate(angleDeg * Math.PI / 180);
    if (scale !== 1) ctx.scale(scale, scale);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
  ctx.restore();
}

function drawCurvedText(text, radius, centerClockDeg, font, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.font = font;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const chars = Array.from(text);
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const totalWidth = widths.reduce((a, b) => a + b, 0);
  const totalAngle = totalWidth / radius;
  let curAngle = ((centerClockDeg - 90) * Math.PI / 180) - totalAngle / 2;
  for (let i = 0; i < chars.length; i++) {
    const half = (widths[i] / 2) / radius;
    curAngle += half;
    ctx.save();
    ctx.translate(225 + Math.cos(curAngle) * radius, 225 + Math.sin(curAngle) * radius);
    ctx.rotate(curAngle + Math.PI / 2);
    ctx.fillText(chars[i], 0, 0);
    ctx.restore();
    curAngle += half;
  }
  ctx.restore();
}

function formatTimeWordsEs(h24, m) {
  const h12 = (h24 % 12) || 12;
  const nextH12 = (h12 % 12) + 1;
  if (h24 === 12 && m === 0) return 'Mediodía';
  if (h24 === 0 && m === 0) return 'Medianoche';
  if (m === 0) return `Las ${h12} en punto`;
  if (m === 15) return `Las ${h12} y cuarto`;
  if (m === 30) return `Las ${h12} y media`;
  if (m === 45) return `Cuarto para las ${nextH12}`;
  return `Las ${h12} y ${m}`;
}

function render(nowMs) {
  const t = nowMs / 1000;
  const timeStyle = document.getElementById('sTime').value;
  const timeFont  = document.getElementById('sFont').value;
  const timeSize  = document.getElementById('sSize').value;
  const dateStyle = document.getElementById('sDate').value;
  const showBatt  = document.getElementById('tBatt').checked;
  const battPct   = Number(document.getElementById('rBatt').value);
  document.getElementById('battVal').textContent = battPct + '%';
  const showCal   = document.getElementById('tCal').checked;
  const showSteps = document.getElementById('tSteps').checked;
  const showTemp  = document.getElementById('tTemp').checked;
  const showFog   = document.getElementById('tFog').checked;
  const isAod     = document.getElementById('tAod').checked;
  const curMode   = MODES.find(m => m.id === mode);

  ctx.clearRect(0, 0, 450, 450);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 450, 450);

  if (!isAod) {
    // 1. ASTROS
    if (mode === 'sunny' || mode === 'partly_day') {
      drawImg('fx_sun_corona',    -35, -100, 520, 520, (150 + 50 * Math.sin(nowMs / 1600)) / 255, (nowMs / 260) % 360);
      drawImg('fx_sun_shimmer_a',  -5,  -70, 460, 460, (125 + 110 * Math.sin(nowMs / 1100)) / 255, (nowMs / 190) % 360, 1 + 0.06 * Math.sin(nowMs / 1200));
      drawImg('fx_sun_shimmer_b',  -5,  -70, 460, 460, (115 + 115 * Math.cos(nowMs / 1350)) / 255, 360 - ((nowMs / 240) % 360), 1 + 0.05 * Math.cos(nowMs / 1450));
      drawImg('sol',               65,    0, 320, 320, 1, 0, 1 + 0.02 * Math.sin(nowMs / 1400));
    }
    if (mode === 'drizzle_day') {
      drawImg('fx_sun_corona', -35, -100, 520, 520, 95 / 255);
      drawImg('sol',            75,   10, 300, 300, 170 / 255);
    }
    if (mode.startsWith('moon_') || mode === 'partly_night') {
      drawImg('celestial_stars_a', 0, 0, 450, 450, (110 + 115 * Math.sin(nowMs / 1300)) / 255);
      drawImg('celestial_stars_b', 0, 0, 450, 450, (110 + 115 * Math.cos(nowMs / 1700)) / 255);
      const mImg = mode === 'partly_night' ? 'moon_full' : mode;
      drawImg(mImg, 85, 10, 280, 280, 1);
    }

    // 2. RELÁMPAGOS SLIDE-DOWN + FLASH
    if (mode === 'storm') {
      const c = t % 12;
      const flash = (c < 0.35) || (c > 4.0 && c < 4.40) || (c > 8.2 && c < 8.65);
      if (flash) drawImg('fx_storm_flash', 0, 0, 450, 450, 180 / 255);
      if (c < 0.18 || (c > 0.24 && c < 0.42)) {
        drawImg('lightning_left', 0, clamp(-130 + c * 900, -130, 0), 450, 450, 1);
      }
      if ((c >= 4.0 && c < 4.18) || (c > 4.24 && c < 4.45)) {
        drawImg('lightning_center', 0, clamp(-130 + (c - 4.0) * 900, -130, 0), 450, 450, 1);
      }
      if ((c >= 8.2 && c < 8.40) || (c > 8.48 && c < 8.72)) {
        drawImg('lightning_double', 0, clamp(-130 + (c - 8.2) * 900, -130, 0), 450, 450, 1);
      }
    }

    // 3. NUBES DIFERENCIADAS DÍA / NOCHE
    if (mode === 'partly_day') {
      drawImg('cloud_white_1',     -360 + ((t * 14.0) % 1180),          10, 330, 330, 1);
      drawImg('cloud_white_2_sep', -380 + (((t * 14.0) + 590) % 1180), -15, 360, 360, 230 / 255);
    } else if (mode === 'partly_night') {
      drawImg('cloud_dark_1',     -360 + ((t * 14.0) % 1180),          10, 330, 330, 1);
      drawImg('cloud_dark_2_sep', -380 + (((t * 14.0) + 590) % 1180), -15, 360, 360, 230 / 255);
    } else if (mode === 'cloudy_day' || mode === 'snow_day' || mode === 'sleet_day') {
      drawImg('cloud_white_3',       -400 + ((t * 12.5) % 1050),         -35, 380, 380, 1);
      drawImg('cloud_white_1',       -390 + (((t * 12.5) + 210) % 1050), -45, 370, 370, 225 / 255);
      drawImg('cloud_white_2_stack', -400 + (((t * 12.5) + 420) % 1050), -15, 380, 380, 235 / 255);
      drawImg('cloud_white_2_sep',   -390 + (((t * 12.5) + 630) % 1050), -30, 370, 370, 220 / 255);
      drawImg('cloud_white_1',       -390 + (((t * 12.5) + 840) % 1050),   5, 370, 370, 240 / 255);
    } else if (mode === 'cloudy_night' || mode === 'snow_night') {
      drawImg('cloud_dark_2_stack', -400 + ((t * 12.5) % 1050),         -35, 380, 380, 1);
      drawImg('cloud_dark_1',       -390 + (((t * 12.5) + 210) % 1050), -45, 370, 370, 225 / 255);
      drawImg('cloud_dark_2_sep',   -400 + (((t * 12.5) + 420) % 1050), -15, 380, 380, 235 / 255);
      drawImg('cloud_dark_2_stack', -390 + (((t * 12.5) + 630) % 1050), -30, 370, 370, 220 / 255);
      drawImg('cloud_dark_1',       -390 + (((t * 12.5) + 840) % 1050),   5, 370, 370, 240 / 255);
    } else if (mode === 'drizzle_day') {
      drawImg('cloud_white_2_sep', -390 + ((t * 13.0) % 1100),         -30, 370, 370, 215 / 255);
      drawImg('cloud_dark_1',      -380 + (((t * 13.0) + 370) % 1100), -40, 360, 360, 190 / 255);
      drawImg('cloud_white_1',     -380 + (((t * 13.0) + 740) % 1100), -15, 360, 360, 225 / 255);
    } else if (mode === 'drizzle_night') {
      drawImg('cloud_dark_2_sep',   -390 + ((t * 13.0) % 1100),         -30, 370, 370, 220 / 255);
      drawImg('cloud_dark_1',       -380 + (((t * 13.0) + 370) % 1100), -40, 360, 360, 1);
      drawImg('cloud_dark_2_stack', -380 + (((t * 13.0) + 740) % 1100), -15, 360, 360, 225 / 255);
    } else if (mode === 'rain_day') {
      drawImg('cloud_dark_2_stack', -410 + ((t * 13.0) % 1000),         -50, 400, 400, 1);
      drawImg('cloud_white_2_sep',  -395 + (((t * 13.0) + 200) % 1000), -35, 385, 385, 225 / 255);
      drawImg('cloud_dark_1',       -405 + (((t * 13.0) + 400) % 1000), -40, 395, 395, 235 / 255);
      drawImg('cloud_dark_2_sep',   -410 + (((t * 13.0) + 600) % 1000), -25, 395, 395, 230 / 255);
      drawImg('cloud_white_1',      -395 + (((t * 13.0) + 800) % 1000), -45, 385, 385, 220 / 255);
    } else if (mode === 'rain_night') {
      drawImg('cloud_dark_2_stack', -410 + ((t * 13.0) % 1000),         -50, 400, 400, 1);
      drawImg('cloud_dark_1',       -395 + (((t * 13.0) + 200) % 1000), -35, 385, 385, 235 / 255);
      drawImg('cloud_dark_2_sep',   -405 + (((t * 13.0) + 400) % 1000), -40, 395, 395, 235 / 255);
      drawImg('cloud_dark_2_stack', -410 + (((t * 13.0) + 600) % 1000), -25, 395, 395, 240 / 255);
      drawImg('cloud_dark_1',       -395 + (((t * 13.0) + 800) % 1000), -45, 385, 385, 230 / 255);
    } else if (mode === 'storm') {
      drawImg('cloud_dark_2_stack', -420 + ((t * 13.5) % 900),         -75, 415, 415, 1);
      drawImg('cloud_dark_1',       -410 + (((t * 13.5) + 180) % 900), -55, 405, 405, 1);
      drawImg('cloud_dark_2_sep',   -420 + (((t * 13.5) + 360) % 900), -65, 415, 415, 1);
      drawImg('cloud_dark_2_stack', -420 + (((t * 13.5) + 540) % 900), -50, 410, 410, 1);
      drawImg('cloud_dark_1',       -410 + (((t * 13.5) + 720) % 900), -68, 405, 405, 1);
    } else if (mode === 'fog_day') {
      drawImg('cloud_white_2_sep',   -390 + ((t * 11.0) % 1100),         -30, 370, 370, 195 / 255);
      drawImg('cloud_white_1',       -370 + (((t * 11.0) + 370) % 1100), -10, 350, 350, 205 / 255);
      drawImg('cloud_white_2_stack', -390 + (((t * 11.0) + 740) % 1100), -20, 370, 370, 185 / 255);
    } else if (mode === 'fog_night') {
      drawImg('cloud_dark_2_sep',   -390 + ((t * 11.0) % 1100),         -30, 370, 370, 205 / 255);
      drawImg('cloud_dark_1',       -370 + (((t * 11.0) + 370) % 1100), -10, 350, 350, 210 / 255);
      drawImg('cloud_dark_2_stack', -390 + (((t * 11.0) + 740) % 1100), -20, 370, 370, 195 / 255);
    } else if (mode === 'wind_day') {
      drawImg('cloud_white_1',     -380 + ((t * 28.0) % 1100),         -20, 360, 360, 1);
      drawImg('cloud_white_2_sep', -390 + (((t * 28.0) + 550) % 1100),   0, 370, 370, 220 / 255);
    }

    // 4. NIEVE LEJANA / NIEBLA DESCENDENTE / VIENTO
    if (mode === 'snow_day' || mode === 'snow_night' || mode === 'sleet_day') {
      drawImg('fx_snow_slow', 14 * Math.sin(nowMs / 1700), -450 + ((t * 38) % 450), 450, 900, 1);
    }
    if (mode === 'fog_day' || mode === 'fog_night') {
      drawImg('fx_fog_descend', 18 * Math.sin(nowMs / 2600), -450 + ((t * 34) % 450), 450, 900, (185 + 45 * Math.sin(nowMs / 2800)) / 255);
    }
    if (mode === 'wind_day') {
      drawImg('fx_wind_streaks', -60 + ((t * 65) % 60), 70, 570, 190, 0.85);
    }
  }

  // 5. HUD + BISEL (ACTIVO Y ATENUADO EN AOD)
  const now = new Date();
  const h24 = now.getHours();
  const m   = now.getMinutes();
  const h12 = (h24 % 12) || 12;
  const hh24 = String(h24).padStart(2, '0');
  const hh12 = String(h12).padStart(2, '0');
  const mm   = String(m).padStart(2, '0');
  const ampm = h24 >= 12 ? 'PM' : 'AM';
  const dd   = String(now.getDate()).padStart(2, '0');
  const moZ  = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  const yy   = String(yyyy).slice(-2);
  const monsS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const monsF = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // 5A. Barra de batería curva por el bisel inferior (9h = 265° -> 6h = 180° -> 3h = 95°, izquierda a derecha)
  if (showBatt) {
    const startRad   = (265 - 90) * Math.PI / 180;
    const endFullRad = (95 - 90) * Math.PI / 180;
    const endValRad  = ((265 - battPct * 1.7) - 90) * Math.PI / 180;
    ctx.save();
    ctx.globalAlpha = isAod ? 0.53 : 1;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath();
    ctx.arc(225, 225, 217, startRad, endFullRad, true);
    ctx.stroke();

    ctx.strokeStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(225, 225, 217, startRad, endValRad, true);
    ctx.stroke();
    ctx.restore();
  }

  // 5B. Calorías (9h–12h, centrado en -45° = 315°) y Pasos (12h–3h, centrado en +45°)
  if (showCal) {
    drawCurvedText('🔥 342 kcal', 193, -45, 'bold 16px Segoe UI, sans-serif', isAod ? 0.58 : 1);
  }
  if (showSteps) {
    drawCurvedText('👟 6,840', 193, 45, 'bold 16px Segoe UI, sans-serif', isAod ? 0.58 : 1);
  }

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 5C. Hora configurable (Tamaño x Fuente x Formato, creciendo hacia arriba desde y=337)
  if (timeStyle !== 'hidden') {
    const sx = timeSize === 'xl' ? 1.26 : (timeSize === 'large' ? 1.14 : 1.0);
    const sy = timeSize === 'xl' ? 1.75 : (timeSize === 'large' ? 1.35 : 1.0);
    ctx.save();
    ctx.globalAlpha = isAod ? 0.76 : 1;
    ctx.fillStyle = '#ffffff';
    ctx.translate(225, 337);
    ctx.scale(sx, sy);
    ctx.translate(-225, -337);
    if (timeStyle === 'h24') {
      ctx.font = `800 82px '${timeFont}', Segoe UI, sans-serif`;
      ctx.fillText(`${hh24}:${mm}`, 225, 294);
    } else if (timeStyle === 'h12_short') {
      ctx.font = `800 82px '${timeFont}', Segoe UI, sans-serif`;
      ctx.fillText(`${hh12}:${mm}`, 225, 294);
    } else if (timeStyle === 'h12_ampm') {
      ctx.font = `800 72px '${timeFont}', Segoe UI, sans-serif`;
      ctx.fillText(`${hh12}:${mm}`, 196, 294);
      ctx.font = `bold 24px '${timeFont}', Segoe UI, sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillText(ampm, 342, 304);
    } else if (timeStyle === 'text_es') {
      const txt = formatTimeWordsEs(h24, m);
      ctx.font = `800 36px '${timeFont}', Segoe UI, sans-serif`;
      ctx.fillText(txt, 225, 294);
    }
    ctx.restore();
  }

  ctx.globalAlpha = isAod ? 0.43 : 0.68;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(72, 348, 306, 2);

  // 5D. Fecha configurable
  if (dateStyle !== 'hidden') {
    ctx.globalAlpha = isAod ? 0.65 : 1;
    ctx.fillStyle = '#ffffff';
    let dStr = '';
    if (dateStyle === 'short') {
      dStr = `${dd}/${moZ}/${yyyy}`;
      ctx.font = 'bold 22px Segoe UI, sans-serif';
    } else if (dateStyle === 'medium') {
      dStr = `${dd}-${monsS[now.getMonth()]}-${yy}`;
      ctx.font = 'bold 22px Segoe UI, sans-serif';
    } else if (dateStyle === 'long') {
      dStr = `${now.getDate()} ${monsF[now.getMonth()]} ${yyyy}`;
      ctx.font = 'bold 18px Segoe UI, sans-serif';
    }
    ctx.fillText(dStr, 176, 378);
  }

  // 5E. Temperatura
  if (showTemp) {
    ctx.globalAlpha = isAod ? 0.43 : 0.68;
    ctx.fillRect(296, 354, 2, 42);
    ctx.globalAlpha = isAod ? 0.65 : 1;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 25px Segoe UI, sans-serif';
    ctx.fillText(`${curMode.temp}°`, 346, 378);
  }
  ctx.restore();

  // 6. SOBRE EL CRISTAL
  if (!isAod) {
    if (mode === 'rain_day' || mode === 'rain_night' || mode === 'storm') {
      drawImg('fx_rain_slow', 0, -450 + ((t * 260) % 450), 450, 900, 1);
      drawImg('fx_rain_fast', 0, -450 + ((t * 440) % 450), 450, 900, 1);
      drawImg('fx_glass_drops_slide', 0, -450 + ((t * 22) % 450), 450, 900, 0.92);
      if (showFog) {
        drawImg('fx_glass_fog', 0, 0, 450, 450, (75 + 75 * Math.sin(nowMs / 3500)) / 255);
      }
    }
    if (mode === 'drizzle_day' || mode === 'drizzle_night') {
      drawImg('fx_rain_slow', 0, -450 + ((t * 230) % 450), 450, 900, 185 / 255);
      drawImg('fx_glass_drops_slide', 0, -450 + ((t * 16) % 450), 450, 900, 160 / 255);
      if (mode === 'drizzle_day') {
        drawImg('fx_rainbow_prism', 0, 0, 450, 450, (110 + 75 * Math.sin(nowMs / 2600)) / 255, 4 * Math.sin(nowMs / 3800));
      }
    }
    if (mode === 'snow_day' || mode === 'snow_night') {
      drawImg('fx_snow_fast', -16 * Math.sin(nowMs / 1300), -450 + ((t * 72) % 450), 450, 900, 1);
    }
    if (mode === 'sleet_day') {
      drawImg('fx_rain_slow', 0, -450 + ((t * 260) % 450), 450, 900, 170 / 255);
      drawImg('fx_snow_fast', -16 * Math.sin(nowMs / 1300), -450 + ((t * 72) % 450), 450, 900, 1);
    }
    if (mode === 'fog_day' || mode === 'fog_night') {
      drawImg('fx_fog_low_fast',   -450 + ((t * 80) % 450),  195, 900, 260, (185 + 45 * Math.sin(nowMs / 2100)) / 255);
      drawImg('fx_fog_low_fast_b', -450 + ((t * 125) % 450), 235, 900, 220, (195 + 50 * Math.cos(nowMs / 1700)) / 255);
      if (showFog) {
        drawImg('fx_glass_fog', 0, 0, 450, 450, (60 + 55 * Math.sin(nowMs / 3200)) / 255);
      }
    }
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
